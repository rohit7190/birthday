<!DOCTYPE html>
<html>
<head>
  <title>404 Error 😂</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      text-align: center;
      font-family: Arial, sans-serif;
      background: black;
      color: white;
      overflow: hidden;
    }

    h1 {
      font-size: 80px;
      color: red;
      animation: glitch 1s infinite;
    }

    @keyframes glitch {
      0% { text-shadow: 2px 2px red; }
      50% { text-shadow: -2px -2px blue; }
      100% { text-shadow: 2px 2px red; }
    }

    p {
      font-size: 20px;
      opacity: 0;
      animation: fadeIn 2s forwards;
      animation-delay: 1s;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    button {
      padding: 12px 20px;
      font-size: 18px;
      margin-top: 20px;
      background: red;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    #msg {
      margin-top: 30px;
      font-size: 22px;
      opacity: 0;
      transition: opacity 1s ease;
    }

    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      background: yellow;
      top: 0;
      animation: fall linear infinite;
    }

    @keyframes fall {
      to {
        transform: translateY(100vh);
      }
    }

  </style>
</head>

<body>

<h1>404</h1>

<p>System Crash 💀 Too Much Drama Detected, Clow founded 🤡</p>
<p>Click below button reshma..</p>


<button onclick="reveal()">Fix Error</button>

<p id="msg"></p>

<script>
function reveal() {
  const msg = document.getElementById("msg");
  msg.style.opacity = 1;
  msg.innerHTML = "Thik hai..😭 Happy Birthday ❤️ Tu annoying hai bohat😌 ismai bhi mu mat bana lena ab 🤡 😭";

  // create confetti
  for (let i = 0; i < 30; i++) {
    let confetti = document.createElement("div");
    confetti.className = "confetti";
    confetti.style.left = Math.random() * 100 + "vw";
    confetti.style.animationDuration = (2 + Math.random() * 3) + "s";
    document.body.appendChild(confetti);
  }
}
</script>

</body>
</html>
